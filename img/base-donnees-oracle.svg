<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOracle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a10"/>
      <stop offset="50%" stop-color="#300d1e"/>
      <stop offset="100%" stop-color="#3d1445"/>
    </linearGradient>
    <linearGradient id="oracleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glowOracle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f87171" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgOracle)"/>

  <!-- Database Cylinder 3D (Center) -->
  <g transform="translate(300, 180)" filter="url(#glowOracle)">
    <!-- Top Cap -->
    <ellipse cx="0" cy="-60" rx="75" ry="24" fill="#ef4444" stroke="#fecaca" stroke-width="2"/>
    <!-- Cylinder Body -->
    <path d="M -75 -60 L -75 40 A 75 24 0 0 0 75 40 L 75 -60 Z" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>
    <!-- Center Disk Line -->
    <path d="M -75 -25 A 75 24 0 0 0 75 -25" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M -75 5 A 75 24 0 0 0 75 5" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- Bottom Cap -->
    <ellipse cx="0" cy="40" rx="75" ry="24" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>

    <text x="0" y="-8" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="900" text-anchor="middle">ORACLE DB</text>
    <text x="0" y="10" fill="#fca5a5" font-size="9" font-family="sans-serif" text-anchor="middle">PL / SQL • Relationnel</text>
  </g>

  <!-- Left: MCD / Modélisation Médicale -->
  <g transform="translate(110, 180)" filter="url(#glowOracle)">
    <rect x="-65" y="-55" width="130" height="110" rx="10" fill="#2d0f1c" stroke="#f43f5e" stroke-width="2"/>
    <text x="0" y="-30" fill="#ffe4e6" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Modélisation MCD</text>
    <rect x="-50" y="-18" width="100" height="18" rx="3" fill="#4c0519"/>
    <text x="0" y="-5" fill="#fda4af" font-size="8" font-family="sans-serif" text-anchor="middle">Formateurs (1,n)</text>
    <rect x="-50" y="4" width="100" height="18" rx="3" fill="#4c0519"/>
    <text x="0" y="17" fill="#fda4af" font-size="8" font-family="sans-serif" text-anchor="middle">Apprenants (0,n)</text>
    <text x="0" y="42" fill="#fb7185" font-size="8" font-family="sans-serif" text-anchor="middle">Centre Médical</text>
  </g>

  <!-- Right: SQL Engine & Queries -->
  <g transform="translate(490, 180)" filter="url(#glowOracle)">
    <rect x="-65" y="-55" width="130" height="110" rx="10" fill="#2d0f1c" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="-30" fill="#f3e8ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Requêtes SQL</text>
    <g fill="#e9d5ff" font-family="monospace" font-size="8" text-anchor="start">
      <text x="-52" y="-10">SELECT * FROM</text>
      <text x="-52" y="5">plannings_cours</text>
      <text x="-52" y="20">JOIN session</text>
      <text x="-52" y="38" fill="#34d399">&gt; Index Optimisé</text>
    </g>
  </g>

  <!-- Relations connectors -->
  <line x1="175" y1="180" x2="225" y2="180" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="375" y1="180" x2="425" y2="180" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="190" height="28" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
  <text x="115" y="38" fill="#ffe4e6" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">ORACLE &amp; BASES DE DONNÉES</text>
</svg>

