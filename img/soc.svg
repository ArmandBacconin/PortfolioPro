<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGrad3)"/>

  <!-- Radar Circles -->
  <circle cx="300" cy="180" r="130" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="180" r="85" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.25"/>
  <circle cx="300" cy="180" r="40" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.35"/>
  <line x1="300" y1="50" x2="300" y2="310" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>
  <line x1="170" y1="180" x2="430" y2="180" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>

  <!-- Center SOC Hub -->
  <g transform="translate(300, 180)" filter="url(#shadow3)">
    <circle r="34" fill="#0f172a" stroke="#06b6d4" stroke-width="3"/>
    <text x="0" y="6" fill="#22d3ee" font-size="14" font-family="sans-serif" font-weight="900" text-anchor="middle">SOC</text>
  </g>

  <!-- Wazuh SIEM (Top Left) -->
  <g transform="translate(160, 100)" filter="url(#shadow3)">
    <rect x="-60" y="-22" width="120" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" fill="#e0f2fe" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">🛡️ Wazuh SIEM</text>
  </g>
  <line x1="210" y1="120" x2="275" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Suricata NIDS (Top Right) -->
  <g transform="translate(440, 100)" filter="url(#shadow3)">
    <rect x="-60" y="-22" width="120" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" fill="#fef3c7" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">⚡ Suricata NIDS</text>
  </g>
  <line x1="390" y1="120" x2="325" y2="160" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- MISP Threat Intel (Bottom Left) -->
  <g transform="translate(160, 260)" filter="url(#shadow3)">
    <rect x="-60" y="-22" width="120" height="44" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="0" y="5" fill="#fee2e2" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">🌐 MISP (IoC)</text>
  </g>
  <line x1="210" y1="240" x2="275" y2="200" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Zammad Ticketing (Bottom Right) -->
  <g transform="translate(440, 260)" filter="url(#shadow3)">
    <rect x="-60" y="-22" width="120" height="44" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="5" fill="#d1fae5" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">🎫 Zammad Helpdesk</text>
  </g>
  <line x1="390" y1="240" x2="325" y2="200" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="180" height="28" rx="6" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1"/>
  <text x="110" y="38" fill="#cffafe" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">CYBERSÉCURITÉ &amp; SOC</text>
</svg>

