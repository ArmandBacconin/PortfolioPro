<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGrad2)"/>

  <!-- Radial grid / circles -->
  <circle cx="300" cy="170" r="140" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,6" opacity="0.2"/>
  <circle cx="300" cy="170" r="90" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,5" opacity="0.3"/>

  <!-- Main Shield -->
  <g transform="translate(300, 160)" filter="url(#shadow2)">
    <path d="M 0 -65 L 50 -35 L 50 20 C 50 55 0 80 0 80 C 0 80 -50 55 -50 20 L -50 -35 Z" fill="url(#shieldGrad)" stroke="#c7d2fe" stroke-width="3"/>
    <!-- Recovery Check / Icon -->
    <path d="M -16 5 L -5 16 L 18 -10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="105" fill="#e0e7ff" font-size="14" font-family="sans-serif" font-weight="bold" text-anchor="middle">CCVG • RTO / RPO</text>
  </g>

  <!-- Left: Production Site -->
  <g transform="translate(130, 160)" filter="url(#shadow2)">
    <rect x="-55" y="-35" width="110" height="70" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="-10" fill="#a5b4fc" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">SITE PRINCIPAL</text>
    <text x="0" y="12" fill="#38bdf8" font-size="10" font-family="sans-serif" text-anchor="middle">Production Active</text>
    <circle cx="0" cy="24" r="4" fill="#10b981"/>
  </g>

  <!-- Right: Backup / PRA Site -->
  <g transform="translate(470, 160)" filter="url(#shadow2)">
    <rect x="-55" y="-35" width="110" height="70" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="-10" fill="#a5b4fc" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">SITE SECOURS</text>
    <text x="0" y="12" fill="#c084fc" font-size="10" font-family="sans-serif" text-anchor="middle">PRA / Réplication</text>
    <circle cx="0" cy="24" r="4" fill="#a855f7"/>
  </g>

  <!-- Connecting sync arrows -->
  <path d="M 190 145 Q 300 95 410 145" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 410 175 Q 300 225 190 175" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="160" height="28" rx="6" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="1"/>
  <text x="100" y="38" fill="#e0e7ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">PRA / PCA STRATÉGIE</text>
</svg>

