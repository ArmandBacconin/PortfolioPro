<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="abGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="bgGlowDisk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1052" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#15082a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0a0316" stop-opacity="1"/>
    </radialGradient>

    <!-- Outer Soft Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Disk with Cyber Depth -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGlowDisk)"/>

  <!-- Outer Luminous Tech Ring -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#ringGrad)" stroke-width="15" filter="url(#softGlow)"/>

  <!-- Subtle Inner Orbit Grid -->
  <circle cx="250" cy="250" r="202" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.3"/>

  <!-- Perfectly Centered AB Monogram Group -->
  <g filter="url(#softGlow)" transform="translate(-33, 0)">
    <!-- Outer 'A' Diagonal + 'B' Upper & Lower Curves + Bottom Bar -->
    <path d="M 125 350
             L 242 145
             L 362 145
             C 412 145, 436 168, 436 198
             C 436 220, 418 236, 386 242
             C 424 248, 442 268, 442 298
             C 442 332, 412 350, 362 350
             L 125 350 Z"
          fill="none"
          stroke="url(#abGrad)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Inner 'A' Triangle & Central Bridge -->
    <path d="M 242 145
             L 310 268
             L 205 268
             L 240 205
             L 300 238
             L 386 242"
          fill="none"
          stroke="url(#abGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Cyber Node Sparkles -->
    <circle cx="242" cy="145" r="5" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="362" cy="145" r="3.5" fill="#38bdf8"/>
    <circle cx="436" cy="198" r="3.5" fill="#c084fc"/>
    <circle cx="442" cy="298" r="3.5" fill="#38bdf8"/>
    <circle cx="125" cy="350" r="4" fill="#a855f7"/>
  </g>
</svg>
