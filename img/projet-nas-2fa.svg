<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2b"/>
      <stop offset="50%" stop-color="#122d42"/>
      <stop offset="100%" stop-color="#1b4965"/>
    </linearGradient>
    <filter id="glowNas" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0ea5e9" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgNas)"/>

  <!-- Tech Grid Background -->
  <g stroke="#0ea5e9" stroke-width="1" opacity="0.12">
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="520" y1="0" x2="520" y2="360"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
  </g>

  <!-- NAS Bay Unit (Center) -->
  <g transform="translate(300, 180)" filter="url(#glowNas)">
    <rect x="-110" y="-70" width="220" height="140" rx="14" fill="#0f2638" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Drive Bays -->
    <rect x="-90" y="-50" width="80" height="40" rx="4" fill="#1b3f5c"/>
    <circle cx="-25" cy="-30" r="3" fill="#22c55e"/>
    <rect x="10" y="-50" width="80" height="40" rx="4" fill="#1b3f5c"/>
    <circle cx="75" cy="-30" r="3" fill="#22c55e"/>
    <rect x="-90" y="0" width="80" height="40" rx="4" fill="#1b3f5c"/>
    <circle cx="-25" cy="20" r="3" fill="#22c55e"/>
    <rect x="10" y="0" width="80" height="40" rx="4" fill="#1b3f5c"/>
    <circle cx="75" cy="20" r="3" fill="#38bdf8"/>

    <text x="0" y="58" fill="#e0f2fe" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">NAS Synology / QNAP</text>
  </g>

  <!-- 2FA Smartphone (Left) -->
  <g transform="translate(110, 180)" filter="url(#glowNas)">
    <rect x="-40" y="-65" width="80" height="130" rx="12" fill="#0c1e2d" stroke="#a855f7" stroke-width="2.5"/>
    <rect x="-30" y="-50" width="60" height="90" rx="4" fill="#172e42"/>
    <!-- 2FA Code display -->
    <text x="0" y="-20" fill="#c084fc" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">OTP 2FA</text>
    <text x="0" y="2" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">842 190</text>
    <circle cx="0" cy="22" r="8" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="0" cy="54" r="5" fill="#a855f7"/>
    <text x="0" y="82" fill="#e9d5ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Double Auth</text>
  </g>

  <!-- Mail Alerts & SMTP (Right) -->
  <g transform="translate(490, 180)" filter="url(#glowNas)">
    <rect x="-55" y="-50" width="110" height="100" rx="12" fill="#0c1e2d" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="0" y="-18" fill="#fef3c7" font-size="24" font-family="sans-serif" text-anchor="middle">✉️</text>
    <text x="0" y="10" fill="#fde68a" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Alertes SMTP</text>
    <text x="0" y="28" fill="#38bdf8" font-size="9" font-family="sans-serif" text-anchor="middle">IP Whitelist</text>
    <circle cx="0" cy="40" r="3" fill="#22c55e"/>
    <text x="0" y="70" fill="#fef3c7" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Surveillance</text>
  </g>

  <!-- Connectors -->
  <line x1="150" y1="180" x2="190" y2="180" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="410" y1="180" x2="435" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="190" height="28" rx="6" fill="rgba(14, 165, 233, 0.2)" stroke="#38bdf8" stroke-width="1"/>
  <text x="115" y="38" fill="#e0f2fe" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">SÉCURITÉ NAS &amp; 2FA</text>
</svg>

