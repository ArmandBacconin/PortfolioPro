<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#a855f7" stroke-width="1" opacity="0.12">
    <line x1="50" y1="0" x2="50" y2="360"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
  </g>

  <!-- Interconnection Lines (Mesh) -->
  <g stroke="url(#glowGrad1)" stroke-width="2.5" opacity="0.75" stroke-dasharray="6,4">
    <line x1="180" y1="190" x2="300" y2="100"/>
    <line x1="300" y1="100" x2="420" y2="190"/>
    <line x1="180" y1="190" x2="420" y2="190"/>
    <line x1="300" y1="100" x2="300" y2="250"/>
    <line x1="180" y1="190" x2="300" y2="250"/>
    <line x1="420" y1="190" x2="300" y2="250"/>
  </g>

  <!-- Node 1 (Top) -->
  <g transform="translate(300, 100)" filter="url(#shadow1)">
    <circle r="38" fill="#581c87" stroke="#c084fc" stroke-width="3"/>
    <rect x="-16" y="-12" width="32" height="24" rx="4" fill="#a855f7"/>
    <circle cx="-8" cy="0" r="2" fill="#fff"/>
    <circle cx="0" cy="0" r="2" fill="#fff"/>
    <circle cx="8" cy="0" r="2" fill="#fff"/>
    <text x="0" y="52" fill="#e9d5ff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Nœud 1 (PVE)</text>
  </g>

  <!-- Node 2 (Left) -->
  <g transform="translate(180, 190)" filter="url(#shadow1)">
    <circle r="38" fill="#581c87" stroke="#c084fc" stroke-width="3"/>
    <rect x="-16" y="-12" width="32" height="24" rx="4" fill="#a855f7"/>
    <circle cx="-8" cy="0" r="2" fill="#fff"/>
    <circle cx="0" cy="0" r="2" fill="#fff"/>
    <circle cx="8" cy="0" r="2" fill="#fff"/>
    <text x="0" y="52" fill="#e9d5ff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Nœud 2 (PVE)</text>
  </g>

  <!-- Node 3 (Right) -->
  <g transform="translate(420, 190)" filter="url(#shadow1)">
    <circle r="38" fill="#581c87" stroke="#c084fc" stroke-width="3"/>
    <rect x="-16" y="-12" width="32" height="24" rx="4" fill="#a855f7"/>
    <circle cx="-8" cy="0" r="2" fill="#fff"/>
    <circle cx="0" cy="0" r="2" fill="#fff"/>
    <circle cx="8" cy="0" r="2" fill="#fff"/>
    <text x="0" y="52" fill="#e9d5ff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Nœud 3 (PVE)</text>
  </g>

  <!-- Center Ceph Storage Core -->
  <g transform="translate(300, 250)" filter="url(#shadow1)">
    <rect x="-70" y="-20" width="140" height="40" rx="20" fill="#7e22ce" stroke="#f0abfc" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">⚡ Ceph Storage</text>
  </g>

  <!-- Top Badge / Title -->
  <rect x="20" y="20" width="150" height="28" rx="6" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
  <text x="95" y="38" fill="#f3e8ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">HA CLUSTER &amp; CEPH</text>
</svg>

