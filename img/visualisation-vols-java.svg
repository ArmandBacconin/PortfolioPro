<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c132c"/>
      <stop offset="50%" stop-color="#191942"/>
      <stop offset="100%" stop-color="#2a1b4e"/>
    </linearGradient>
    <filter id="glowJava" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#818cf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgJava)"/>

  <!-- Stylized France Map Outline / Nodes Grid -->
  <g stroke="#4f46e5" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M 230 80 L 330 70 L 400 130 L 440 220 L 360 300 L 260 310 L 180 240 L 170 140 Z"/>
  </g>

  <!-- Flight Graph Edges -->
  <g stroke="#818cf8" stroke-width="2" stroke-dasharray="5,4" opacity="0.75">
    <line x1="280" y1="120" x2="380" y2="190"/>
    <line x1="280" y1="120" x2="220" y2="200"/>
    <line x1="280" y1="120" x2="340" y2="270"/>
    <line x1="220" y1="200" x2="250" y2="280"/>
    <line x1="380" y1="190" x2="340" y2="270"/>
    <line x1="250" y1="280" x2="340" y2="270"/>
  </g>

  <!-- Graph Node 1 (Paris - CDG) -->
  <g transform="translate(280, 120)" filter="url(#glowJava)">
    <circle r="22" fill="#ef4444" stroke="#fecaca" stroke-width="2.5"/>
    <text x="0" y="4" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">CDG</text>
    <text x="0" y="-28" fill="#fca5a5" font-size="9" font-family="sans-serif" text-anchor="middle">Couleur 1</text>
  </g>

  <!-- Graph Node 2 (Lyon - LYS) -->
  <g transform="translate(380, 190)" filter="url(#glowJava)">
    <circle r="20" fill="#3b82f6" stroke="#bfdbfe" stroke-width="2.5"/>
    <text x="0" y="4" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">LYS</text>
    <text x="36" y="4" fill="#93c5fd" font-size="9" font-family="sans-serif" text-anchor="start">Couleur 2</text>
  </g>

  <!-- Graph Node 3 (Nantes - NTE) -->
  <g transform="translate(220, 200)" filter="url(#glowJava)">
    <circle r="18" fill="#10b981" stroke="#a7f3d0" stroke-width="2.5"/>
    <text x="0" y="4" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">NTE</text>
    <text x="-32" y="4" fill="#6ee7b7" font-size="9" font-family="sans-serif" text-anchor="end">Couleur 3</text>
  </g>

  <!-- Graph Node 4 (Marseille - MRS) -->
  <g transform="translate(340, 270)" filter="url(#glowJava)">
    <circle r="19" fill="#f59e0b" stroke="#fef3c7" stroke-width="2.5"/>
    <text x="0" y="4" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">MRS</text>
    <text x="0" y="32" fill="#fde68a" font-size="9" font-family="sans-serif" text-anchor="middle">Couleur 4</text>
  </g>

  <!-- Graph Node 5 (Bordeaux - BOD) -->
  <g transform="translate(250, 280)" filter="url(#glowJava)">
    <circle r="18" fill="#ec4899" stroke="#fbcfe8" stroke-width="2.5"/>
    <text x="0" y="4" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">BOD</text>
    <text x="-30" y="4" fill="#f472b6" font-size="9" font-family="sans-serif" text-anchor="end">Couleur 2</text>
  </g>

  <!-- Flying Plane Icon -->
  <g transform="translate(330, 155) rotate(35)" filter="url(#glowJava)">
    <text x="0" y="0" font-size="22" text-anchor="middle">✈️</text>
  </g>

  <!-- Algorithm Legend Box (Left) -->
  <g transform="translate(80, 290)" filter="url(#glowJava)">
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="-3" fill="#f3e8ff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Welsh-Powell</text>
    <text x="0" y="11" fill="#c084fc" font-size="8" font-family="sans-serif" text-anchor="middle">Coloration Graphes</text>
  </g>

  <!-- Java Tech Box (Right) -->
  <g transform="translate(520, 290)" filter="url(#glowJava)">
    <rect x="-55" y="-20" width="110" height="40" rx="8" fill="#1e1b4b" stroke="#f97316" stroke-width="1.5"/>
    <text x="0" y="-3" fill="#fff7ed" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">☕ Java GUI</text>
    <text x="0" y="11" fill="#fdba74" font-size="8" font-family="sans-serif" text-anchor="middle">Swing / JavaFX</text>
  </g>

  <!-- Top Badge -->
  <rect x="20" y="20" width="200" height="28" rx="6" fill="rgba(129, 140, 248, 0.2)" stroke="#818cf8" stroke-width="1"/>
  <text x="120" y="38" fill="#e0e7ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">JAVA • GRAPHES DE VOLS</text>
</svg>

