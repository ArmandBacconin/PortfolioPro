<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSupport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f2d"/>
      <stop offset="50%" stop-color="#241242"/>
      <stop offset="100%" stop-color="#3b1d6e"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glowSupport" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgSupport)"/>

  <!-- Tech Grid Lines -->
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="260" x2="600" y2="260"/>
  </g>

  <!-- Central Helpdesk Window / Console -->
  <g transform="translate(300, 180)" filter="url(#glowSupport)">
    <rect x="-140" y="-80" width="280" height="160" rx="14" fill="#1b1335" stroke="#a855f7" stroke-width="2.5"/>
    
    <!-- Window Header -->
    <rect x="-140" y="-80" width="280" height="32" rx="14" fill="#291b4f"/>
    <rect x="-140" y="-60" width="280" height="12" fill="#291b4f"/>
    <circle cx="-118" cy="-64" r="5" fill="#ef4444"/>
    <circle cx="-102" cy="-64" r="5" fill="#f59e0b"/>
    <circle cx="-86" cy="-64" r="5" fill="#10b981"/>
    <text x="10" y="-60" fill="#e9d5ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">SimplyDesk • Téléassistance</text>

    <!-- Ticket 1: Résolu -->
    <g transform="translate(-120, -30)">
      <rect width="240" height="28" rx="6" fill="#221543" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="5" fill="#10b981"/>
      <text x="32" y="18" fill="#f3e8ff" font-size="11" font-family="sans-serif" font-weight="600">#1402 Réseau &amp; Messagerie</text>
      <rect x="180" y="6" width="50" height="16" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="205" y="18" fill="#34d399" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">RÉSOLU</text>
    </g>

    <!-- Ticket 2: En cours -->
    <g transform="translate(-120, 6)">
      <rect width="240" height="28" rx="6" fill="#221543" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="5" fill="#a855f7"/>
      <text x="32" y="18" fill="#f3e8ff" font-size="11" font-family="sans-serif" font-weight="600">#1403 Dépannage Postes &amp; AD</text>
      <rect x="180" y="6" width="50" height="16" rx="4" fill="rgba(168, 85, 247, 0.2)"/>
      <text x="205" y="18" fill="#c084fc" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">EN COURS</text>
    </g>

    <!-- Remote Screen Status -->
    <g transform="translate(-120, 42)">
      <rect width="240" height="24" rx="4" fill="#130b26"/>
      <text x="120" y="16" fill="#a5b4fc" font-size="10" font-family="monospace" text-anchor="middle">⚡ Session VNC/RDP Connectée</text>
    </g>
  </g>

  <!-- Left Support Badge (Headset / Tech) -->
  <g transform="translate(90, 180)" filter="url(#glowSupport)">
    <circle r="36" fill="#221543" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="8" fill="#c7d2fe" font-size="28" font-family="sans-serif" text-anchor="middle">🎧</text>
    <text x="0" y="52" fill="#c7d2fe" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Support N1/N2</text>
  </g>

  <!-- Right Diagnostics Badge -->
  <g transform="translate(510, 180)" filter="url(#glowSupport)">
    <circle r="36" fill="#221543" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" fill="#38bdf8" font-size="28" font-family="sans-serif" text-anchor="middle">🛠️</text>
    <text x="0" y="52" fill="#bae6fd" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Diagnostics</text>
  </g>

  <!-- Connectors -->
  <path d="M 130 180 L 160 180" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 440 180 L 470 180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="180" height="28" rx="6" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
  <text x="110" y="38" fill="#f3e8ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">HELPDESK &amp; ASSISTANCE</text>
</svg>

