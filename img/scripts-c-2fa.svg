<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDevC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#151d3b"/>
      <stop offset="100%" stop-color="#241b4a"/>
    </linearGradient>
    <filter id="glowDevC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgDevC)"/>

  <!-- Code Matrix background effect -->
  <g fill="#4338ca" opacity="0.15" font-family="monospace" font-size="12">
    <text x="30" y="70">int sockfd = socket(AF_INET, SOCK_STREAM, 0);</text>
    <text x="30" y="95">connect(sockfd, (struct sockaddr*)&amp;serv, sizeof(serv));</text>
    <text x="30" y="290">unsigned char hash[SHA256_DIGEST_LENGTH];</text>
    <text x="30" y="315">verify_totp_token(user_token, secret_key);</text>
  </g>

  <!-- Left: Client C Terminal -->
  <g transform="translate(140, 180)" filter="url(#glowDevC)">
    <rect x="-85" y="-65" width="170" height="130" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-85" y="-65" width="170" height="24" rx="10" fill="#1e293b"/>
    <rect x="-85" y="-45" width="170" height="4" fill="#1e293b"/>
    <circle cx="-70" cy="-53" r="4" fill="#ef4444"/>
    <circle cx="-58" cy="-53" r="4" fill="#f59e0b"/>
    <circle cx="-46" cy="-53" r="4" fill="#22c55e"/>
    <text x="0" y="-50" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">client.c</text>
    
    <g fill="#e0f2fe" font-family="monospace" font-size="9" text-anchor="start">
      <text x="-75" y="-22">&gt; ./client</text>
      <text x="-75" y="-6">Connexion: OK</text>
      <text x="-75" y="10">Auth 2FA: [******]</text>
      <text x="-75" y="26">Token envoyé...</text>
      <text x="-75" y="44" fill="#34d399">&gt; AUTH VALIDÉE</text>
    </g>
  </g>

  <!-- Center Security Lock & SHA Hash Shield -->
  <g transform="translate(300, 180)" filter="url(#glowDevC)">
    <circle r="36" fill="#1e1b4b" stroke="#a855f7" stroke-width="2.5"/>
    <text x="0" y="-6" fill="#c084fc" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">SHA-256</text>
    <text x="0" y="12" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle">2FA OTP</text>
    <circle cx="0" cy="24" r="3" fill="#22c55e"/>
  </g>

  <!-- Right: Server C Terminal -->
  <g transform="translate(460, 180)" filter="url(#glowDevC)">
    <rect x="-85" y="-65" width="170" height="130" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <rect x="-85" y="-65" width="170" height="24" rx="10" fill="#1e293b"/>
    <rect x="-85" y="-45" width="170" height="4" fill="#1e293b"/>
    <circle cx="-70" cy="-53" r="4" fill="#ef4444"/>
    <circle cx="-58" cy="-53" r="4" fill="#f59e0b"/>
    <circle cx="-46" cy="-53" r="4" fill="#22c55e"/>
    <text x="0" y="-50" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">server.c (Socket)</text>
    
    <g fill="#f3e8ff" font-family="monospace" font-size="9" text-anchor="start">
      <text x="-75" y="-22">&gt; ./serveur :4433</text>
      <text x="-75" y="-6">Client 192.168.1.5</text>
      <text x="-75" y="10">Vérification Hash</text>
      <text x="-75" y="26">Calcul TOTP: OK</text>
      <text x="-75" y="44" fill="#34d399">&gt; SESSION OUVERTE</text>
    </g>
  </g>

  <!-- Socket connection streams -->
  <line x1="225" y1="165" x2="264" y2="175" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4"/>
  <line x1="336" y1="185" x2="375" y2="195" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="200" height="28" rx="6" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="1"/>
  <text x="120" y="38" fill="#e0e7ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">SOCKETS C &amp; AUTH 2FA</text>
</svg>

