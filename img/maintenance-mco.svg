<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMCO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#1b2038"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <filter id="glowMCO" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgMCO)"/>

  <!-- Rotating Gear Outline -->
  <g transform="translate(300, 180)" opacity="0.12" stroke="#c084fc" stroke-width="2" fill="none">
    <circle r="120"/>
    <circle r="80"/>
  </g>

  <!-- Central Server / MCO Hub -->
  <g transform="translate(300, 180)" filter="url(#glowMCO)">
    <rect x="-130" y="-80" width="260" height="160" rx="14" fill="#16192e" stroke="#818cf8" stroke-width="2.5"/>

    <!-- Header bar -->
    <rect x="-130" y="-80" width="260" height="30" rx="14" fill="#232746"/>
    <rect x="-130" y="-60" width="260" height="10" fill="#232746"/>
    <text x="0" y="-60" fill="#e0e7ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">⚙️ Centre MCO &amp; WSUS</text>

    <!-- Item 1: WSUS Windows Updates -->
    <g transform="translate(-110, -32)">
      <rect width="220" height="26" rx="5" fill="#1e223f" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="17" fill="#e0f2fe" font-size="10" font-family="sans-serif">🪟 Windows Patches (WSUS)</text>
      <circle cx="195" cy="13" r="4" fill="#10b981"/>
    </g>

    <!-- Item 2: Firmware & BIOS -->
    <g transform="translate(-110, 0)">
      <rect width="220" height="26" rx="5" fill="#1e223f" stroke="#a855f7" stroke-width="1"/>
      <text x="12" y="17" fill="#f3e8ff" font-size="10" font-family="sans-serif">⚡ BIOS &amp; Pilotes Matériels</text>
      <circle cx="195" cy="13" r="4" fill="#10b981"/>
    </g>

    <!-- Item 3: Alertes & MCO -->
    <g transform="translate(-110, 32)">
      <rect width="220" height="26" rx="5" fill="#1e223f" stroke="#f59e0b" stroke-width="1"/>
      <text x="12" y="17" fill="#fef3c7" font-size="10" font-family="sans-serif">🛡️ Intégrité &amp; MCO 99.9%</text>
      <circle cx="195" cy="13" r="4" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Left: Workstations Fleet -->
  <g transform="translate(90, 180)" filter="url(#glowMCO)">
    <circle r="36" fill="#1e223f" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" fill="#38bdf8" font-size="26" font-family="sans-serif" text-anchor="middle">🖥️</text>
    <text x="0" y="52" fill="#bae6fd" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Parc Postes</text>
  </g>

  <!-- Right: Servers & Services -->
  <g transform="translate(510, 180)" filter="url(#glowMCO)">
    <circle r="36" fill="#1e223f" stroke="#c084fc" stroke-width="2"/>
    <text x="0" y="8" fill="#c084fc" font-size="26" font-family="sans-serif" text-anchor="middle">🗄️</text>
    <text x="0" y="52" fill="#e9d5ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Serveurs</text>
  </g>

  <!-- Connector lines -->
  <path d="M 130 180 L 170 180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 430 180 L 470 180" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="190" height="28" rx="6" fill="rgba(129, 140, 248, 0.2)" stroke="#818cf8" stroke-width="1"/>
  <text x="115" y="38" fill="#e0e7ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">MAINTENANCE &amp; MCO</text>
</svg>

