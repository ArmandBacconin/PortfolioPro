<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#818cf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGrad5)"/>

  <!-- Server Tower (Center) -->
  <g transform="translate(300, 180)" filter="url(#shadow5)">
    <rect x="-60" y="-80" width="120" height="160" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
    <!-- Drive bays -->
    <rect x="-45" y="-60" width="90" height="22" rx="4" fill="#312e81"/>
    <circle cx="30" cy="-49" r="3" fill="#10b981"/>
    <rect x="-45" y="-30" width="90" height="22" rx="4" fill="#312e81"/>
    <circle cx="30" cy="-19" r="3" fill="#10b981"/>
    <rect x="-45" y="0" width="90" height="22" rx="4" fill="#312e81"/>
    <circle cx="30" cy="11" r="3" fill="#38bdf8"/>
    <!-- Ventilation -->
    <line x1="-35" y1="40" x2="35" y2="40" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
    <line x1="-35" y1="48" x2="35" y2="48" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
    <line x1="-35" y1="56" x2="35" y2="56" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Cloud / Services Badges Left -->
  <g transform="translate(130, 130)" filter="url(#shadow5)">
    <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="5" fill="#f3e8ff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">☁️ Nextcloud</text>
  </g>
  <g transform="translate(130, 230)" filter="url(#shadow5)">
    <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="5" fill="#e0e7ff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">🐳 Docker Apps</text>
  </g>

  <!-- Cloud / Services Badges Right -->
  <g transform="translate(470, 130)" filter="url(#shadow5)">
    <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" fill="#e0f2fe" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">📡 Nginx Proxy</text>
  </g>
  <g transform="translate(470, 230)" filter="url(#shadow5)">
    <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#1e1b4b" stroke="#ec4899" stroke-width="2"/>
    <text x="0" y="5" fill="#fdf2f8" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">⚡ Servarr Stack</text>
  </g>

  <!-- Connectors -->
  <path d="M 185 130 L 240 150" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 185 230 L 240 210" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 415 150 L 360 150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 415 230 L 360 210" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="190" height="28" rx="6" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
  <text x="115" y="38" fill="#f3e8ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">HOMELAB &amp; SELF-HOSTING</text>
</svg>

