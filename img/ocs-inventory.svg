<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOcs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1926"/>
      <stop offset="50%" stop-color="#11293c"/>
      <stop offset="100%" stop-color="#1d3e56"/>
    </linearGradient>
    <filter id="glowOcs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14b8a6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgOcs)"/>

  <!-- Scanning radar grid -->
  <g stroke="#14b8a6" stroke-width="1" opacity="0.15">
    <circle cx="300" cy="180" r="140" fill="none"/>
    <circle cx="300" cy="180" r="90" fill="none"/>
    <line x1="50" y1="180" x2="550" y2="180"/>
  </g>

  <!-- Central OCS Inventory NG Server -->
  <g transform="translate(300, 180)" filter="url(#glowOcs)">
    <rect x="-120" y="-75" width="240" height="150" rx="14" fill="#0f2638" stroke="#14b8a6" stroke-width="2.5"/>

    <rect x="-120" y="-75" width="240" height="30" rx="14" fill="#183c57"/>
    <rect x="-120" y="-55" width="240" height="10" fill="#183c57"/>
    <text x="0" y="-55" fill="#ccfbf1" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">OCS Inventory NG Server</text>

    <!-- Scan Info Bars -->
    <g transform="translate(-100, -30)">
      <rect width="200" height="22" rx="4" fill="#1b4563"/>
      <text x="10" y="15" fill="#e0f2fe" font-size="9" font-family="sans-serif">🖥️ Matériel : CPU, RAM, Disques</text>
      <circle cx="185" cy="11" r="3" fill="#22c55e"/>
    </g>

    <g transform="translate(-100, -2)">
      <rect width="200" height="22" rx="4" fill="#1b4563"/>
      <text x="10" y="15" fill="#e0f2fe" font-size="9" font-family="sans-serif">📦 Logiciels &amp; Licences détectés</text>
      <circle cx="185" cy="11" r="3" fill="#22c55e"/>
    </g>

    <g transform="translate(-100, 26)">
      <rect width="200" height="22" rx="4" fill="#1b4563"/>
      <text x="10" y="15" fill="#e0f2fe" font-size="9" font-family="sans-serif">📡 Découverte Réseau IPDiscover</text>
      <circle cx="185" cy="11" r="3" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Left: Client Agent Scanning -->
  <g transform="translate(100, 180)" filter="url(#glowOcs)">
    <circle r="36" fill="#0f2638" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="8" fill="#38bdf8" font-size="24" font-family="sans-serif" text-anchor="middle">🔎</text>
    <text x="0" y="52" fill="#bae6fd" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Agent OCS</text>
  </g>

  <!-- Right: Automated Telemetry & Reports -->
  <g transform="translate(500, 180)" filter="url(#glowOcs)">
    <circle r="36" fill="#0f2638" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="8" fill="#c084fc" font-size="24" font-family="sans-serif" text-anchor="middle">📊</text>
    <text x="0" y="52" fill="#e9d5ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Télémétrie Parc</text>
  </g>

  <!-- Sync lines -->
  <line x1="140" y1="180" x2="180" y2="180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="420" y1="180" x2="460" y2="180" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="200" height="28" rx="6" fill="rgba(20, 184, 166, 0.2)" stroke="#14b8a6" stroke-width="1"/>
  <text x="120" y="38" fill="#ccfbf1" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">INVENTAIRE DU PARC (OCS)</text>
</svg>

