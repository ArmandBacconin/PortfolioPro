<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgReseau" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#1c1936"/>
      <stop offset="100%" stop-color="#2a1b4e"/>
    </linearGradient>
    <linearGradient id="stormshieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glowReseau" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgReseau)"/>

  <!-- Network Mesh Backing -->
  <g stroke="#6366f1" stroke-width="1" opacity="0.15">
    <line x1="50" y1="50" x2="550" y2="310"/>
    <line x1="550" y1="50" x2="50" y2="310"/>
    <circle cx="300" cy="180" r="140" fill="none"/>
  </g>

  <!-- Central Stormshield SNS Firewall -->
  <g transform="translate(300, 180)" filter="url(#glowReseau)">
    <rect x="-65" y="-60" width="130" height="120" rx="14" fill="#1b1d36" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Brick pattern for Firewall -->
    <rect x="-45" y="-40" width="40" height="14" rx="2" fill="url(#stormshieldGrad)"/>
    <rect x="5" y="-40" width="40" height="14" rx="2" fill="url(#stormshieldGrad)"/>
    <rect x="-25" y="-22" width="50" height="14" rx="2" fill="url(#stormshieldGrad)"/>
    <text x="0" y="16" fill="#fecaca" font-size="11" font-family="sans-serif" font-weight="900" text-anchor="middle">STORMSHIELD</text>
    <text x="0" y="32" fill="#38bdf8" font-size="9" font-family="sans-serif" text-anchor="middle">VPN IPsec • NAT • DMZ</text>
    <circle cx="-15" cy="46" r="3" fill="#22c55e"/>
    <circle cx="0" cy="46" r="3" fill="#22c55e"/>
    <circle cx="15" cy="46" r="3" fill="#38bdf8"/>
  </g>

  <!-- Left: Sites Distants (Écoles / Chaponost / Brignais) -->
  <g transform="translate(110, 180)" filter="url(#glowReseau)">
    <rect x="-60" y="-55" width="120" height="110" rx="12" fill="#1b1d36" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="-25" fill="#f3e8ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Sites Distants</text>
    <!-- VLAN badges -->
    <rect x="-45" y="-12" width="90" height="18" rx="4" fill="#581c87"/>
    <text x="0" y="1" fill="#e9d5ff" font-size="9" font-family="sans-serif" text-anchor="middle">VLAN 10 Peda</text>
    <rect x="-45" y="10" width="90" height="18" rx="4" fill="#4338ca"/>
    <text x="0" y="23" fill="#c7d2fe" font-size="9" font-family="sans-serif" text-anchor="middle">VLAN 20 ToIP GRETAP</text>
    <text x="0" y="44" fill="#a5b4fc" font-size="9" font-family="sans-serif" text-anchor="middle">Écoles / Mairies</text>
  </g>

  <!-- Right: Datacenter Mairie / Core Network -->
  <g transform="translate(490, 180)" filter="url(#glowReseau)">
    <rect x="-60" y="-55" width="120" height="110" rx="12" fill="#1b1d36" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-25" fill="#e0f2fe" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Cœur de Réseau</text>
    <rect x="-45" y="-12" width="90" height="18" rx="4" fill="#0369a1"/>
    <text x="0" y="1" fill="#e0f2fe" font-size="9" font-family="sans-serif" text-anchor="middle">IPsec IKEv2 (ANSSI)</text>
    <rect x="-45" y="10" width="90" height="18" rx="4" fill="#0f766e"/>
    <text x="0" y="23" fill="#ccfbf1" font-size="9" font-family="sans-serif" text-anchor="middle">ToIP Centralisée</text>
    <text x="0" y="44" fill="#7dd3fc" font-size="9" font-family="sans-serif" text-anchor="middle">Switchs N3 Cisco</text>
  </g>

  <!-- IPsec encrypted tunnels (connecting lines) -->
  <g stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4">
    <path d="M 170 160 L 235 160"/>
    <path d="M 365 160 L 430 160"/>
  </g>
  <g stroke="#a855f7" stroke-width="3" stroke-dasharray="6,4">
    <path d="M 170 200 L 235 200"/>
    <path d="M 365 200 L 430 200"/>
  </g>

  <!-- Top Badge -->
  <rect x="20" y="20" width="210" height="28" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
  <text x="125" y="38" fill="#fee2e2" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">INGÉNIERIE RÉSEAU &amp; CCNA</text>
</svg>

