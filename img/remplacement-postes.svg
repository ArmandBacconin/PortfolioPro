<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPostes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1426"/>
      <stop offset="50%" stop-color="#192244"/>
      <stop offset="100%" stop-color="#241846"/>
    </linearGradient>
    <filter id="glowPostes" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#818cf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgPostes)"/>

  <!-- Left: Ancien Poste (Old PC) -->
  <g transform="translate(140, 180)" filter="url(#glowPostes)">
    <rect x="-65" y="-55" width="130" height="110" rx="10" fill="#1b203a" stroke="#64748b" stroke-width="2"/>
    <rect x="-45" y="-40" width="90" height="50" rx="4" fill="#0f172a"/>
    <text x="0" y="-10" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Ancien Poste</text>
    <text x="0" y="5" fill="#64748b" font-size="9" font-family="sans-serif" text-anchor="middle">Windows 7/10 OBS</text>
    <!-- Stand -->
    <rect x="-15" y="10" width="30" height="15" fill="#334155"/>
    <rect x="-25" y="25" width="50" height="6" rx="2" fill="#475569"/>
    <text x="0" y="45" fill="#ef4444" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Remplacement</text>
  </g>

  <!-- Center: Migration Arrow & Deployment Master -->
  <g transform="translate(300, 180)" filter="url(#glowPostes)">
    <circle r="36" fill="#2e1065" stroke="#a855f7" stroke-width="2.5"/>
    <path d="M -15 0 L 10 0 M 0 -10 L 10 0 L 0 10" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="-45" fill="#e9d5ff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Mastering &amp; Données</text>
    <text x="0" y="52" fill="#38bdf8" font-size="9" font-family="sans-serif" text-anchor="middle">Migration Profils AD</text>
  </g>

  <!-- Right: Nouveau Poste Moderne (New PC) -->
  <g transform="translate(460, 180)" filter="url(#glowPostes)">
    <rect x="-65" y="-55" width="130" height="110" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="-45" y="-40" width="90" height="50" rx="4" fill="#0c4a6e"/>
    <text x="0" y="-10" fill="#e0f2fe" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Nouveau PC</text>
    <text x="0" y="5" fill="#38bdf8" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Windows 11 Ent.</text>
    <!-- Stand -->
    <rect x="-15" y="10" width="30" height="15" fill="#0284c7"/>
    <rect x="-25" y="25" width="50" height="6" rx="2" fill="#38bdf8"/>
    <text x="0" y="45" fill="#22c55e" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">✓ En Production</text>
  </g>

  <!-- Migration streams -->
  <line x1="205" y1="180" x2="260" y2="180" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="340" y1="180" x2="395" y2="180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Top Badge -->
  <rect x="20" y="20" width="220" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
  <text x="130" y="38" fill="#e0f2fe" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">DÉPLOIEMENT DU PARC POSTES</text>
</svg>

